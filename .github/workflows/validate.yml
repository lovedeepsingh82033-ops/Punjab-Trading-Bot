name: Punjab Scanner Offline Validation

on:
  push:
    branches:
      - main
      - scanner-quality-validation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Resolve and install hash-pinned dependencies
        run: |
          python -m pip install "pip==25.3" "pip-tools==7.5.2"
          pip-compile --resolver=backtracking --generate-hashes --output-file=/tmp/requirements.lock requirements.txt
          python -m pip install --require-hashes -r /tmp/requirements.lock
      - name: Compile and run offline tests
        run: |
          python -m py_compile main.py
          python -m unittest discover -s tests -v
