name: Punjab Market Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: read

concurrency:
  group: punjab-market-scanner
  cancel-in-progress: false

jobs:
  market-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore persistent signal history
        run: |
          git fetch origin signal-history
          git show origin/signal-history:signal_history.csv > signal_history.csv

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline scanner tests
        run: |
          python -m py_compile main.py
          python -m unittest discover -s tests -v

      - name: Run market scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python main.py

      - name: Upload signal history artifact
        uses: actions/upload-artifact@v7
        with:
          name: signal-history
          path: signal_history.csv
          if-no-files-found: error
          retention-days: 1

  persist-history:
    needs: market-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout persistent history branch
        uses: actions/checkout@v7
        with:
          ref: signal-history
          persist-credentials: false

      - name: Download signal history artifact
        uses: actions/download-artifact@v8
        with:
          name: signal-history
          path: artifact

      - name: Persist signal history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp artifact/signal_history.csv signal_history.csv
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signal_history.csv
          if git diff --cached --quiet; then
            echo "No new history records to commit."
          else
            git commit -m "Update market signal history"
            git push origin HEAD:signal-history
          fi
