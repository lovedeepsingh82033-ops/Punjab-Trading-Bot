name: Offline PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "main.py"
      - "telegram_bot.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/offline-pr-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application and bot modules
        run: |
          python -m py_compile main.py telegram_bot.py

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
