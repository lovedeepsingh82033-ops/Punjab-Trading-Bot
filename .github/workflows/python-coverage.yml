name: Python Test Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**.py"
      - "tests/**"
      - "requirements.txt"
      - "requirements.lock"
      - ".github/workflows/python-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install locked project dependencies and coverage tool
        run: |
          python -m pip install --only-binary=:all: pip==25.3
          python -m pip install --only-binary=:all: -r requirements.lock
          python -m pip install --only-binary=:all: coverage==7.11.0

      - name: Run unit tests with coverage
        run: |
          coverage run --branch --source=main,telegram_bot,simulation -m unittest discover -s tests -v
          coverage report -m
          coverage xml -o coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7
