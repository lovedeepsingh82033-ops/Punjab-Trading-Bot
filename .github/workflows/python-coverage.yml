name: Python Test Coverage
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**.py"
      - "tests/**"
      - "requirements.txt"
      - "requirements.lock"
      - ".github/workflows/python-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Resolve and install hash-locked dependencies
        run: |
          python -m pip install --only-binary=:all: "pip==25.3" "pip-tools==7.5.2"
          cat requirements.txt > /tmp/coverage-requirements.in
          printf '\ncoverage==7.11.0\n' >> /tmp/coverage-requirements.in
          pip-compile --resolver=backtracking --generate-hashes --output-file=/tmp/coverage-requirements.lock /tmp/coverage-requirements.in
          python -m pip install --only-binary=:all: --require-hashes -r /tmp/coverage-requirements.lock

      - name: Run unit tests with coverage
        run: |
          coverage run --branch --source=main,telegram_bot,simulation -m unittest discover -s tests -v
          coverage report -m
          coverage xml -o coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7
