name: Generate Python dependency lock

on:
  push:
    branches:
      - integration/all-open-prs-batch
    paths:
      - requirements.txt
      - .github/workflows/generate-lock.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Generate hash-pinned lockfile
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-tools==7.5.2"
          pip-compile --resolver=backtracking --generate-hashes --output-file=requirements.lock requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: python-dependency-lock
          path: requirements.lock
          if-no-files-found: error
